<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サイネージ管理</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #fff; --text: #1d2330; --sub: #6b7385; --line: #dde2ea;
    --brand: #1e88e5; --brand-weak: #e3f0fc; --danger: #d93025; --ok: #188038; --warn-bg: #fff4e5; --warn: #9a5b00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1c2029; --text: #e8eaf0; --sub: #9aa2b3; --line: #2c3240;
      --brand: #5aa9f0; --brand-weak: #1d2c3d; --danger: #f28b82; --ok: #81c995; --warn-bg: #3a2c12; --warn: #fdd29d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .bar h1 { font-size: 18px; margin: 0; flex: 1; min-width: 160px; }
  .layout { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  aside { position: sticky; top: 70px; }
  @media (max-width: 860px) { aside { position: static; } }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 16px; margin: 0 0 4px; }
  .sub { color: var(--sub); font-size: 13px; word-break: break-all; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button.danger { color: var(--danger); }
  button.small { padding: 3px 10px; font-size: 13px; }
  button:disabled { opacity: .5; cursor: default; }
  label.check { display: inline-flex; align-items: center; gap: 6px; }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin: 10px 0; font-size: 14px; }

  /* 端末一覧 */
  .devices { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .device { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer; }
  .device.selected { border-color: var(--brand); background: var(--brand-weak); }
  .device .dname { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .device .dsub { font-size: 12px; color: var(--sub); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; background: var(--sub); }
  .dot.ok { background: var(--ok); } .dot.pin { background: #f9ab00; } .dot.offline { background: var(--danger); }
  .bulk { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .bulk .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .drop { margin: 12px 0; border: 2px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; color: var(--sub); display: block; cursor: pointer; }
  .drop.over { border-color: var(--brand); background: var(--brand-weak); }
  .drop input { display: none; }
  .queue { list-style: none; margin: 0 0 8px; padding: 0; font-size: 13px; }
  .queue li { display: grid; grid-template-columns: 1fr 90px; gap: 8px; align-items: center; padding: 3px 0; }
  .queue .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  progress { width: 100%; height: 8px; }
  .done { color: var(--ok); } .fail { color: var(--danger); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .file { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .thumb { aspect-ratio: 16 / 10; background: #0b0d12 center / contain no-repeat; display: flex; align-items: center; justify-content: center; color: #cfd6e4; font-size: 28px; cursor: pointer; }
  .meta { padding: 6px 8px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
  .meta .fname { word-break: break-all; }
  .meta .row { display: flex; justify-content: space-between; align-items: center; color: var(--sub); }
  .meta button { padding: 2px 8px; font-size: 12px; }
  .form { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px 20px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > span { font-size: 13px; color: var(--sub); }
  select, input[type=number], input[type=password], input[type=text] { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
  fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px 14px; margin: 0 0 14px; }
  legend { font-weight: bold; padding: 0 6px; }
  #login { max-width: 360px; margin: 12vh auto; text-align: center; }
  #login input { width: 100%; font-size: 22px; letter-spacing: 6px; text-align: center; margin: 12px 0; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 18px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); z-index: 10; }
  #toast.show { opacity: 1; }
  .empty { color: var(--sub); font-size: 14px; padding: 8px 0; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .log { font-size: 13px; max-height: 220px; overflow: auto; margin: 6px 0 0; padding-left: 18px; }
</style>
</head>
<body>

<div id="login" hidden>
  <section>
    <h2>サイネージ管理</h2>
    <p class="sub">端末の設定画面に表示されている PIN（6桁）を入力してください。</p>
    <form id="loginForm">
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="••••••">
      <button class="primary" style="width:100%">ログイン</button>
    </form>
    <p id="loginError" class="sub" style="color:var(--danger)"></p>
  </section>
</div>

<div id="app" hidden>
  <header>
    <div class="bar">
      <h1>サイネージ管理</h1>
      <label class="check sub"><input type="checkbox" id="autoReload" checked> 変更後すぐ再生に反映</label>
      <button id="refreshBtn">一覧を更新</button>
    </div>
  </header>
  <div class="layout">
    <aside>
      <section>
        <div class="head">
          <h2>端末一覧</h2>
          <button class="small" id="addDeviceBtn" title="自動で見つからない端末を IP アドレスで追加">＋ 追加</button>
        </div>
        <p class="sub">同じネットワークのサイネージ端末が自動で表示されます。クリックで操作する端末を切り替え、チェックした端末はまとめて操作できます。</p>
        <label class="check sub"><input type="checkbox" id="checkAll"> すべて選択</label>
        <ul class="devices" id="devices"></ul>
        <div class="bulk" id="bulk" hidden>
          <strong id="bulkTitle"></strong>
          <div class="row">
            <button class="primary small" id="bulkReload">今すぐ反映</button>
            <button class="small" id="bulkSettings" title="右側の設定欄の内容を、チェックした端末に送る">設定を送る</button>
            <button class="small" id="bulkPin">PINをそろえる</button>
          </div>
          <div class="row">
            <select id="bulkZone"><option value="0">区画1</option><option value="1">区画2</option><option value="2">区画3</option></select>
            <label class="small"><button class="small" type="button" id="bulkUploadBtn">ファイルを送る</button>
              <input type="file" id="bulkFiles" multiple accept="image/*,video/*" hidden></label>
          </div>
          <ol class="log" id="bulkLog"></ol>
        </div>
      </section>
    </aside>

    <main>
      <section id="deviceHead">
        <div class="head">
          <div>
            <h2 id="devTitle"></h2>
            <div class="sub" id="devSub"></div>
          </div>
          <div class="row">
            <button class="small primary" id="reloadBtn" title="フォルダを読み直して先頭から再生">今すぐ反映</button>
            <button class="small" id="renameBtn">端末名を変更</button>
            <button class="small" id="removeBtn" hidden>一覧から外す</button>
          </div>
        </div>
        <div class="warn" id="devWarn" hidden></div>
      </section>
      <div id="zones"></div>
      <section id="settingsSec">
        <h2>設定</h2>
        <p class="sub">保存すると、この端末の再生画面にすぐ反映されます。フォルダと天気予報の地域は、端末の設定画面で変更してください。</p>
        <form id="settings">
          <fieldset>
            <legend>画面分割</legend>
            <div class="form">
              <label class="field"><span>分割方法</span>
                <select name="layout">
                  <option value="0">1画面</option><option value="1">左右2分割</option>
                  <option value="2">上下2分割</option><option value="3">メイン＋サイド</option>
                </select></label>
              <label class="field" id="splitField"><span>比率（区画1 : 区画2）</span>
                <select name="splitPercent"></select></label>
              <label class="field"><span>区画1 の表示内容</span><select name="zone0"></select></label>
              <label class="field" data-zone="1"><span>区画2 の表示内容</span><select name="zone1"></select></label>
              <label class="field" data-zone="2"><span>区画3 の表示内容</span><select name="zone2"></select></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>再生</legend>
            <div class="form">
              <label class="field"><span>画像1枚あたりの表示秒数</span><input type="number" name="imageSeconds" min="1" max="3600"></label>
              <label class="check"><input type="checkbox" name="shuffle"> シャッフル再生</label>
              <label class="check"><input type="checkbox" name="recursive"> サブフォルダも含める</label>
              <label class="check"><input type="checkbox" name="videoSound"> 動画の音声を再生</label>
            </div>
          </fieldset>
          <fieldset>
            <legend>時計</legend>
            <div class="form">
              <label class="check"><input type="checkbox" name="clockEnabled"> 再生中に常に時計を表示</label>
              <label class="field"><span>位置</span>
                <select name="clockPosition"><option value="0">右上</option><option value="1">右下</option><option value="2">左上</option><option value="3">左下</option></select></label>
              <label class="field"><span>大きさ</span>
                <select name="clockSize"><option value="0">小</option><option value="1">中</option><option value="2">大</option></select></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>天気予報 <span class="sub" id="weatherPlace"></span></legend>
            <div class="form">
              <label class="check"><input type="checkbox" name="weatherEnabled"> 一定間隔で天気予報を表示</label>
              <label class="field"><span>表示間隔（分）</span><input type="number" name="weatherIntervalMin" min="1" max="1440"></label>
              <label class="field"><span>1画面の表示秒数</span><input type="number" name="weatherSeconds" min="3" max="600"></label>
              <label class="check"><input type="checkbox" name="weatherTimeSeries"> 3時間ごとの予報も表示</label>
            </div>
          </fieldset>
          <button class="primary">この端末に保存</button>
        </form>
      </section>
    </main>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  // 端末ごとの PIN（端末ID → PIN）。新しい端末にはまず最後に使った PIN を試す
  const pins = store.get('signage-pins', {});
  let defaultPin = store.get('signage-default-pin', '');
  const savePins = () => { store.set('signage-pins', pins); store.set('signage-default-pin', defaultPin); };

  /** 端末の一覧。key は端末ID（未接続の手動追加分は URL） */
  const devices = new Map();
  const checked = new Set(store.get('signage-checked', []));
  let selectedKey = store.get('signage-selected', null);
  const blobUrls = [];

  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 3500);
  }

  class ApiError extends Error { constructor(msg, status) { super(msg); this.status = status; } }

  /** 端末の API を呼ぶ。dev.url が空ならこのページの端末 */
  async function api(dev, path, opts = {}, timeout = 10000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    let res;
    try {
      res = await fetch(dev.url + path, { ...opts, signal: ctrl.signal, headers: { 'X-Pin': dev.pin || '', ...(opts.headers || {}) } });
    } catch (e) {
      throw new ApiError(e.name === 'AbortError' ? '応答がありません' : '接続できません', 0);
    } finally { clearTimeout(timer); }
    const type = res.headers.get('Content-Type') || '';
    if (!res.ok) {
      const err = type.includes('json') ? (await res.json()).error : res.statusText;
      throw new ApiError(err || ('エラー ' + res.status), res.status);
    }
    return type.includes('json') ? res.json() : res;
  }
  const post = (dev, path, body) => api(dev, path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

  // ------------------------------------------------------------ ログイン・端末の検出

  function showLogin(error = '') {
    $('#app').hidden = true;
    $('#login').hidden = false;
    $('#loginError').textContent = error;
    $('#pin').value = '';
    $('#pin').focus();
  }

  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    defaultPin = $('#pin').value.trim();
    await start();
  });

  /** このページを配信している端末 */
  const self = { key: null, url: '', pin: '', self: true };

  async function start() {
    self.pin = defaultPin;
    try {
      self.state = await api(self, '/api/state');
    } catch (e) {
      if (e.status === 401 || e.status === 429) showLogin(e.message); else toast(e.message);
      return;
    }
    self.key = self.id = self.state.id;
    self.name = self.state.name;
    self.version = self.state.version;
    self.status = 'ok';
    pins[self.id] = self.pin;
    savePins();
    devices.set(self.key, self);
    $('#login').hidden = true;
    $('#app').hidden = false;
    if (!selectedKey) selectedKey = self.key;
    await discover();
  }

  /** 自動検出した端末と手動追加した端末を集め、それぞれに接続を試す */
  async function discover() {
    try {
      const d = await api(self, '/api/devices');
      for (const p of d.peers) addDevice({ key: p.id, id: p.id, name: p.name, url: p.url, version: p.version });
    } catch (e) {}
    for (const url of store.get('signage-manual', [])) {
      if (![...devices.values()].some((d) => d.url === url)) addDevice({ key: url, url, name: url.replace(/^https?:\/\//, ''), manual: true });
    }
    renderDevices();
    await Promise.all([...devices.values()].filter((d) => !d.self).map(check));
    if (!devices.has(selectedKey)) selectedKey = self.key;
    renderDevices();
    renderDetail();
  }

  function addDevice(d) {
    const old = devices.get(d.key);
    if (old && old.manual && old.status === 'ok') {
      devices.set(d.key, { ...old, name: d.name || old.name });
      return;
    }
    devices.set(d.key, { status: 'checking', ...old, ...d });
  }

  /** 端末に接続して状態を取得する（PIN は保存済み → 最後に使ったものの順に試す） */
  async function check(dev) {
    dev.pin = (dev.id && pins[dev.id]) || dev.pin || defaultPin;
    try {
      dev.state = await api(dev, '/api/state', {}, 6000);
      dev.status = 'ok';
      dev.error = '';
      // 手動追加の端末は、ID が分かった時点で ID で管理する
      if (dev.key !== dev.state.id) {
        devices.delete(dev.key);
        if (selectedKey === dev.key) selectedKey = dev.state.id;
        if (checked.delete(dev.key)) checked.add(dev.state.id);
        dev.key = dev.state.id;
        const existing = devices.get(dev.key);
        if (existing && existing !== dev) dev.manual = dev.manual || existing.manual;
        devices.set(dev.key, dev);
      }
      dev.id = dev.state.id;
      dev.name = dev.state.name;
      dev.version = dev.state.version;
      pins[dev.id] = dev.pin;
      savePins();
    } catch (e) {
      dev.status = e.status === 401 || e.status === 429 ? 'pin' : 'offline';
      dev.error = e.message;
    }
    return dev;
  }

  const selected = () => devices.get(selectedKey) || self;

  // ------------------------------------------------------------ 端末一覧

  function renderDevices() {
    const ul = $('#devices');
    ul.replaceChildren();
    const list = [...devices.values()].sort((a, b) => ((b.self ? 1 : 0) - (a.self ? 1 : 0)) || String(a.name).localeCompare(String(b.name), 'ja'));
    for (const d of list) {
      const li = document.createElement('li');
      li.className = 'device' + (d.key === selectedKey ? ' selected' : '');
      li.innerHTML = `<input type="checkbox"><div><div class="dname"></div><div class="dsub"><span class="dot"></span><span class="st"></span></div></div><span class="dsub"></span>`;
      const cb = $('input', li);
      cb.checked = checked.has(d.key);
      cb.addEventListener('click', (e) => e.stopPropagation());
      cb.addEventListener('change', () => { cb.checked ? checked.add(d.key) : checked.delete(d.key); saveChecked(); renderBulk(); });
      $('.dname', li).textContent = d.name + (d.self ? '（この端末）' : '');
      const dot = $('.dot', li);
      dot.classList.add(d.status);
      $('.st', li).textContent = {
        ok: `接続中  v${d.version || ''}`, pin: 'PIN が違います', offline: '応答なし', checking: '確認中…',
      }[d.status] || '';
      $('span.dsub:last-child', li).textContent = d.self ? '' : (d.url || '').replace(/^http:\/\//, '');
      li.addEventListener('click', () => select(d.key));
      ul.append(li);
    }
    $('#checkAll').checked = list.length > 0 && list.every((d) => checked.has(d.key));
    renderBulk();
  }

  function saveChecked() { store.set('signage-checked', [...checked]); }

  $('#checkAll').addEventListener('change', (e) => {
    for (const d of devices.values()) e.target.checked ? checked.add(d.key) : checked.delete(d.key);
    saveChecked();
    renderDevices();
  });

  async function select(key) {
    selectedKey = key;
    store.set('signage-selected', key);
    renderDevices();
    const dev = selected();
    if (dev.status !== 'ok') await check(dev);
    renderDevices();
    renderDetail();
  }

  $('#addDeviceBtn').addEventListener('click', async () => {
    const input = prompt('追加する端末の IP アドレスを入力してください（例：192.168.68.53）\n※ 端末の設定画面の「ブラウザで開くアドレス」に表示されています');
    if (!input) return;
    let url = input.trim().replace(/\/+$/, '');
    if (!/^https?:\/\//.test(url)) url = 'http://' + url;
    if (!/:\d+$/.test(url)) url += ':8080';
    const manual = store.get('signage-manual', []);
    if (!manual.includes(url)) { manual.push(url); store.set('signage-manual', manual); }
    const dev = { key: url, url, name: url.replace(/^http:\/\//, ''), manual: true };
    addDevice(dev);
    await check(devices.get(dev.key));
    renderDevices();
    toast(devices.get(dev.key)?.status === 'offline' ? '追加しましたが、応答がありません' : '追加しました');
  });

  $('#removeBtn').addEventListener('click', () => {
    const dev = selected();
    if (dev.self) return;
    store.set('signage-manual', store.get('signage-manual', []).filter((u) => u !== dev.url));
    devices.delete(dev.key);
    checked.delete(dev.key);
    selectedKey = self.key;
    renderDevices();
    renderDetail();
  });

  $('#refreshBtn').addEventListener('click', async () => {
    try { self.state = await api(self, '/api/state'); } catch (e) {}
    await discover();
    toast('一覧を更新しました');
  });

  // ------------------------------------------------------------ 選択中の端末の詳細

  function renderDetail() {
    const dev = selected();
    $('#devTitle').textContent = dev.name + (dev.self ? '（この端末）' : '');
    $('#devSub').textContent = dev.self ? location.host : (dev.url || '').replace(/^http:\/\//, '');
    $('#removeBtn').hidden = dev.self || !dev.manual;
    const warn = $('#devWarn');
    const ok = dev.status === 'ok' && dev.state;
    $('#reloadBtn').disabled = !ok;
    $('#renameBtn').disabled = !ok;
    $('#settingsSec').hidden = !ok;
    blobUrls.splice(0).forEach(URL.revokeObjectURL);
    $('#zones').replaceChildren();
    warn.hidden = ok;
    if (!ok) {
      warn.replaceChildren();
      if (dev.status === 'pin') {
        warn.append('この端末の PIN が違います（端末ごとに PIN が異なる場合は入力してください）。 ');
        const b = document.createElement('button');
        b.className = 'small'; b.textContent = 'PIN を入力';
        b.addEventListener('click', () => askPin(dev));
        warn.append(b);
      } else {
        warn.textContent = dev.status === 'checking' ? '確認中…' :
          '端末に接続できません。端末の電源・Wi-Fi・管理画面の設定（ON になっているか）を確認してください。';
      }
      return;
    }
    renderZones(dev);
    renderSettings(dev);
  }

  async function askPin(dev) {
    const p = prompt(`「${dev.name}」の PIN（6桁）を入力してください`);
    if (!p) return;
    dev.pin = p.trim();
    if (dev.id) { pins[dev.id] = dev.pin; savePins(); }
    await check(dev);
    renderDevices();
    renderDetail();
    toast(dev.status === 'ok' ? '接続しました' : dev.error);
  }

  const fmtSize = (n) => n >= 1e9 ? (n / 1e9).toFixed(1) + ' GB' : n >= 1e6 ? (n / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1e3)) + ' KB';

  function renderZones(dev) {
    const root = $('#zones');
    for (const z of dev.state.zones) {
      const sec = document.createElement('section');
      if (z.type !== 0) {
        sec.innerHTML = `<h2></h2><p class="sub">天気予報を表示中（地域：<span></span>）</p>`;
        $('h2', sec).textContent = z.label;
        $('span', sec).textContent = dev.state.settings.weatherPlace || '未設定';
        root.append(sec);
        continue;
      }
      const files = z.files || [];
      sec.innerHTML = `
        <h2></h2>
        <div class="sub folder"></div>
        <div class="warn" hidden></div>
        <label class="drop"><input type="file" multiple accept="image/*,video/*">
          ここに画像・動画をドラッグ＆ドロップ、または<u>クリックして選択</u></label>
        <ul class="queue"></ul>
        <div class="grid"></div>`;
      $('h2', sec).textContent = `${z.label}　${files.length} 件`;
      $('.folder', sec).textContent = 'フォルダ：' + (z.folder || '未設定');
      const warn = $('.warn', sec);
      const drop = $('.drop', sec);
      if (!z.folder) {
        warn.hidden = false; warn.textContent = 'この区画のフォルダが未設定です。端末の設定画面で選んでください。';
        drop.hidden = true;
      } else if (!z.writable) {
        warn.hidden = false;
        warn.textContent = 'このフォルダには書き込めないため、アップロード・削除はできません。端末の設定画面で「フォルダを選択」から選び直すか、「アプリ専用フォルダを使う」を選んでください。';
        drop.hidden = true;
      }
      if (z.error) { warn.hidden = false; warn.textContent = z.error; }

      const input = $('input', drop);
      input.addEventListener('change', () => uploadToZone(dev, z, [...input.files], sec));
      drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('over'));
      drop.addEventListener('drop', (e) => {
        e.preventDefault(); drop.classList.remove('over');
        uploadToZone(dev, z, [...e.dataTransfer.files], sec);
      });

      const grid = $('.grid', sec);
      if (!files.length && z.folder) grid.outerHTML = '<p class="empty">画像・動画がありません</p>';
      for (const f of files) grid.append(fileCard(dev, z, f));
      root.append(sec);
    }
    document.querySelectorAll('.thumb[data-name]').forEach((el) => thumbs.observe(el));
  }

  function fileCard(dev, z, f) {
    const card = document.createElement('div');
    card.className = 'file';
    card.innerHTML = `<div class="thumb"></div>
      <div class="meta"><div class="fname"></div>
        <div class="row"><span></span><button class="danger" type="button">削除</button></div></div>`;
    const thumb = $('.thumb', card);
    thumb.textContent = f.video ? '▶' : '';
    if (!f.video) { thumb.dataset.zone = z.index; thumb.dataset.name = f.name; thumb.dataset.dev = dev.key; }
    thumb.addEventListener('click', () => openFile(dev, z.index, f.name));
    $('.fname', card).textContent = f.name;
    $('.row span', card).textContent = (f.video ? '動画・' : '画像・') + fmtSize(f.size);
    const del = $('button', card);
    del.disabled = !z.writable;
    del.addEventListener('click', () => remove(dev, z, f));
    return card;
  }

  const fileUrl = (zone, name) => `/api/file?zone=${zone}&name=${encodeURIComponent(name)}`;

  // 画像のサムネイルは、見える位置に来たら PIN 付きで取得する
  const thumbs = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      const el = e.target;
      thumbs.unobserve(el);
      const dev = devices.get(el.dataset.dev);
      if (!dev) continue;
      api(dev, fileUrl(el.dataset.zone, el.dataset.name), {}, 30000)
        .then((res) => res.blob())
        .then((b) => { const u = URL.createObjectURL(b); blobUrls.push(u); el.style.backgroundImage = `url("${u}")`; })
        .catch(() => { el.textContent = '？'; });
    }
  }, { rootMargin: '200px' });

  async function openFile(dev, zone, name) {
    const w = window.open('', '_blank');
    try {
      const blob = await (await api(dev, fileUrl(zone, name), {}, 120000)).blob();
      const u = URL.createObjectURL(blob);
      if (w) w.location = u; else location.href = u;
    } catch (e) { if (w) w.close(); toast(e.message); }
  }

  const MEDIA = /\.(jpe?g|png|gif|webp|bmp|heic|heif|avif|mp4|m4v|webm|mkv|3gp|mov|ts)$/i;
  const mediaOnly = (files) => files.filter((f) => /^(image|video)\//.test(f.type) || MEDIA.test(f.name));

  /** 1ファイルを送る。onProgress(0〜1) */
  function sendFile(dev, zone, file, onProgress) {
    return new Promise((resolve) => {
      const xhr = new XMLHttpRequest();
      xhr.open('PUT', `${dev.url}/api/upload?zone=${zone}&name=${encodeURIComponent(file.name)}`);
      xhr.setRequestHeader('X-Pin', dev.pin || '');
      xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
      xhr.onload = () => {
        let msg = '';
        try { msg = JSON.parse(xhr.responseText).error || ''; } catch (e) {}
        resolve(xhr.status === 200 ? { ok: true } : { ok: false, error: msg || ('失敗 ' + xhr.status) });
      };
      xhr.onerror = () => resolve({ ok: false, error: '通信エラー' });
      xhr.send(file);
    });
  }

  async function uploadToZone(dev, z, files, sec) {
    files = mediaOnly(files);
    if (!files.length) { toast('画像・動画のファイルを選んでください'); return; }
    const queue = $('.queue', sec);
    let ok = 0;
    for (const f of files) {
      const li = document.createElement('li');
      li.innerHTML = '<div><div class="name"></div><div class="st sub">送信中…</div></div><progress max="1" value="0"></progress>';
      $('.name', li).textContent = `${f.name}（${fmtSize(f.size)}）`;
      queue.append(li);
      const r = await sendFile(dev, z.index, f, (v) => { $('progress', li).value = v; });
      const st = $('.st', li);
      st.textContent = r.ok ? '完了' : r.error;
      st.className = 'st ' + (r.ok ? 'done' : 'fail');
      if (r.ok) ok++;
    }
    toast(`${ok} / ${files.length} 件アップロードしました`);
    if (ok && $('#autoReload').checked) await post(dev, '/api/reload', {}).catch(() => {});
    setTimeout(() => refreshDevice(dev), 800);
  }

  async function remove(dev, z, f) {
    if (!confirm(`「${dev.name}」の「${f.name}」を削除しますか？\n端末からファイルが削除されます。`)) return;
    try {
      await post(dev, '/api/delete', { zone: z.index, name: f.name });
      toast('削除しました');
      if ($('#autoReload').checked) await post(dev, '/api/reload', {}).catch(() => {});
      refreshDevice(dev);
    } catch (e) { toast(e.message); }
  }

  async function refreshDevice(dev) {
    await check(dev);
    renderDevices();
    if (dev.key === selectedKey) renderDetail();
  }

  $('#reloadBtn').addEventListener('click', async () => {
    try { await post(selected(), '/api/reload', {}); toast('再生内容を読み直しました'); } catch (e) { toast(e.message); }
  });

  $('#renameBtn').addEventListener('click', async () => {
    const dev = selected();
    const name = prompt('端末名を入力してください（例：入口、レジ横）', dev.name);
    if (!name || !name.trim()) return;
    try {
      await post(dev, '/api/name', { name: name.trim() });
      toast('端末名を変更しました');
      setTimeout(() => refreshDevice(dev), 1000);
    } catch (e) { toast(e.message); }
  });

  // ------------------------------------------------------------ 設定

  const ZONE_TYPES = [['0', 'フォルダの画像・動画'], ['1', '天気予報']];
  const SPLITS = [25, 30, 40, 50, 60, 70, 75];

  function renderSettings(dev) {
    const s = dev.state.settings;
    const f = $('#settings');
    for (const i of [0, 1, 2]) {
      const sel = f.elements['zone' + i];
      sel.innerHTML = ZONE_TYPES.map(([v, t]) => `<option value="${v}">${t}</option>`).join('');
      sel.value = String(s.zoneTypes[i] ?? 0);
    }
    f.elements.splitPercent.innerHTML = SPLITS.map((p) => `<option value="${p}">${p} : ${100 - p}</option>`).join('');
    for (const el of f.elements) {
      if (!el.name || el.name.startsWith('zone')) continue;
      const v = s[el.name];
      if (v === undefined) continue;
      if (el.type === 'checkbox') el.checked = !!v; else el.value = String(v);
    }
    if (!SPLITS.includes(s.splitPercent)) f.elements.splitPercent.value = '50';
    $('#weatherPlace').textContent = s.weatherPlace ? `（地域：${s.weatherPlace}）` : '';
    syncLayoutFields();
  }

  function syncLayoutFields() {
    const f = $('#settings');
    const layout = Number(f.elements.layout.value);
    const count = layout === 3 ? 3 : layout === 0 ? 1 : 2;
    $('#splitField').hidden = count !== 2;
    f.querySelectorAll('[data-zone]').forEach((el) => { el.hidden = Number(el.dataset.zone) >= count; });
  }
  $('#settings').elements.layout.addEventListener('change', syncLayoutFields);

  function formSettings() {
    const f = $('#settings');
    const body = { zoneTypes: [0, 1, 2].map((i) => Number(f.elements['zone' + i].value)) };
    for (const el of f.elements) {
      if (!el.name || el.name.startsWith('zone')) continue;
      body[el.name] = el.type === 'checkbox' ? el.checked : Number(el.value);
    }
    return body;
  }

  $('#settings').addEventListener('submit', async (e) => {
    e.preventDefault();
    const dev = selected();
    try {
      await post(dev, '/api/settings', formSettings());
      toast(`「${dev.name}」の設定を保存し、再生画面に反映しました`);
      setTimeout(() => refreshDevice(dev), 1200);
    } catch (err) { toast(err.message); }
  });

  // ------------------------------------------------------------ まとめて操作

  const targets = () => [...checked].map((k) => devices.get(k)).filter(Boolean);

  function renderBulk() {
    const list = targets();
    $('#bulk').hidden = list.length === 0;
    $('#bulkTitle').textContent = `チェックした ${list.length} 台をまとめて操作`;
  }

  function logLine(text, cls = '') {
    const li = document.createElement('li');
    li.textContent = text;
    li.className = cls;
    $('#bulkLog').append(li);
    li.scrollIntoView({ block: 'nearest' });
    return li;
  }

  /** 各端末に順番に実行して結果を記録する */
  async function forEachTarget(label, fn) {
    const list = targets();
    $('#bulkLog').replaceChildren();
    let ok = 0;
    for (const dev of list) {
      const li = logLine(`${dev.name}：${label}…`);
      try {
        if (dev.status !== 'ok') await check(dev);
        if (dev.status !== 'ok') throw new Error(dev.status === 'pin' ? 'PIN が違います' : '応答なし');
        const msg = await fn(dev, li);
        li.textContent = `${dev.name}：${msg || '完了'}`;
        li.className = 'done';
        ok++;
      } catch (e) {
        li.textContent = `${dev.name}：${e.message}`;
        li.className = 'fail';
      }
    }
    toast(`${label}：${ok} / ${list.length} 台完了`);
    renderDevices();
    return ok;
  }

  $('#bulkReload').addEventListener('click', () => forEachTarget('今すぐ反映', (dev) => post(dev, '/api/reload', {}).then(() => '反映しました')));

  $('#bulkSettings').addEventListener('click', async () => {
    const list = targets();
    if (!confirm(`右側の設定欄（${selected().name} の設定として表示中の内容）を、チェックした ${list.length} 台に送ります。\n画面分割や区画の表示内容も含めて上書きされます。よろしいですか？`)) return;
    const body = formSettings();
    await forEachTarget('設定を送る', (dev) => post(dev, '/api/settings', body).then(() => '設定を反映しました'));
    setTimeout(() => refreshDevice(selected()), 1200);
  });

  $('#bulkPin').addEventListener('click', async () => {
    const p = prompt('チェックした端末の PIN を、次の6桁にそろえます');
    if (!p) return;
    if (!/^\d{6}$/.test(p.trim())) { toast('PIN は6桁の数字にしてください'); return; }
    const pin = p.trim();
    await forEachTarget('PINをそろえる', async (dev) => {
      await post(dev, '/api/pin', { pin });
      dev.pin = pin;
      if (dev.id) pins[dev.id] = pin;
      return 'PIN を変更しました';
    });
    defaultPin = pin;
    self.pin = pins[self.id] || self.pin;
    savePins();
  });

  $('#bulkUploadBtn').addEventListener('click', () => $('#bulkFiles').click());
  $('#bulkFiles').addEventListener('change', async (e) => {
    const files = mediaOnly([...e.target.files]);
    e.target.value = '';
    if (!files.length) { toast('画像・動画のファイルを選んでください'); return; }
    const zone = Number($('#bulkZone').value);
    const total = fmtSize(files.reduce((a, f) => a + f.size, 0));
    if (!confirm(`${files.length} 件（${total}）を、チェックした ${targets().length} 台の「区画${zone + 1}」に送ります。`)) return;
    await forEachTarget(`区画${zone + 1}にファイルを送る`, async (dev, li) => {
      const z = dev.state?.zones?.[zone];
      if (!z || z.type !== 0) throw new Error(`区画${zone + 1}がフォルダの区画ではありません`);
      if (!z.writable) throw new Error(`区画${zone + 1}のフォルダに書き込めません`);
      let ok = 0;
      for (let i = 0; i < files.length; i++) {
        const r = await sendFile(dev, zone, files[i], (v) => {
          li.textContent = `${dev.name}：送信中 ${i + 1}/${files.length}（${Math.round(v * 100)}%）`;
        });
        if (!r.ok) throw new Error(`${files[i].name}：${r.error}`);
        ok++;
      }
      if ($('#autoReload').checked) await post(dev, '/api/reload', {}).catch(() => {});
      return `${ok} 件送りました`;
    });
    setTimeout(() => refreshDevice(selected()), 800);
  });

  // 端末の状態をときどき確認する
  setInterval(async () => {
    if ($('#app').hidden) return;
    await Promise.all([...devices.values()].filter((d) => !d.self && d.status !== 'ok').map(check));
    renderDevices();
  }, 60000);

  if (defaultPin) start(); else showLogin();
})();
</script>
</body>
</html>
