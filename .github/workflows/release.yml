# GitHub の Releases に、APK・exe を添付して公開する
#  ・タグ（v1.9.1 など）を push する
#  ・または Actions タブから「Run workflow」で、版（tag）と、APK・exe が入っているコミットを指定する
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release のタグ（例：v1.9.1）'
        required: true
      binaries_ref:
        description: 'APK・exe が入っているコミット（省略すると、実行したコミット）'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.binaries_ref || github.sha }}

      - name: チェックサムを確認する
        run: cd release && sha256sum -c SHA256SUMS

      - name: Releases に添付して公開する
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.tag || github.ref_name }}
          body_path: release/README.md
          files: |
            release/*.apk
            release/*.exe
            release/SHA256SUMS
            release/LICENSE
            release/THIRD_PARTY_NOTICES.md
